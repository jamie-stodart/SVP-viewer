<!DOCTYPE html>
<html>
 
<head>
 
<title>SVP Test</title>
 
https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
 
https://unpkg.com/leaflet@1.9.4/dist/leaflet.jsscript>
 
<style>
 
html, body {
margin:0;
height:100%;
}
 
#map {
width:100%;
height:100%;
}
 
</style>
 
</head>
 
<body>
 
<div id="map"></div>
 
<script>
 
var map = L.map('map').setView([-12.4,130.9],5);
 
L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
attribution:'© OpenStreetMap'
}
).addTo(map);
 
map.on('click', function(e){
 
alert(
'Latitude: ' +
e.latlng.lat.toFixed(4) +
'\nLongitude: ' +
e.latlng.lng.toFixed(4)
);
 
});
 
</script>
 
</body>
</html>
