<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVP Viewer</title>
 
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
 
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
 
<style>
html, body {
height: 100%;
margin: 0;
}
 
#map {
width: 100%;
height: 100%;
}
</style>
 
</head>
 
<body>
 
<div id="map"></div>
 
<script>
 
const map = L.map('map').setView([-12.4,130.9],5);
 
L.tileLayer(
'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution: '© OpenStreetMap'
}
).addTo(map);
 
map.on('click', function(e){
 
L.popup()
.setLatLng(e.latlng)
.setContent(
'Lat: '
+ e.latlng.lat.toFixed(4)
+ '<br>Lon: '
+ e.latlng.lng.toFixed(4)
)
.openOn(map);
 
});
 
</script>
 
</body>
</html>
