name: Build WOA23 data

on:
  workflow_dispatch:   # run manually from the Actions tab
    inputs:
      dataset:
        description: "Which data to build"
        type: choice
        options: [both, recent, all]
        default: both

permissions:
  contents: write      # lets the workflow commit data/ back to the repo

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy xarray netCDF4
      - run: python scripts/build_data.py ${{ inputs.dataset }}
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data
          git commit -m "Add WOA23 subset" || echo "No changes"
          git push
